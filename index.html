<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات الرياضيات - الصف السابع</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Tahoma', sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #333; margin-bottom: 15px; font-size: clamp(1.2rem, 4vw, 1.6rem); }
        p { font-size: clamp(0.9rem, 3vw, 1.1rem); color: #555; }
        input[type="number"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        button { background-color: #4CAF50; color: white; padding: 12px; width: 100%; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; transition: background 0.3s; }
        button:hover { background-color: #45a049; }
        #error-msg { color: red; margin-top: 10px; font-size: 14px; }
        .question-box { text-align: right; margin-bottom: 15px; background: #fafafa; padding: 12px; border-radius: 8px; border: 1px solid #eee; }
        .question-box p { font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
        .options label { display: block; margin: 8px 0; cursor: pointer; font-size: 14px; padding: 5px; border-radius: 4px; }
        .options label:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <!-- صفحة تسجيل الدخول -->
    <div class="container" id="login-container">
        <h2>تسجيل دخول الطالب</h2>
        <p>الرجاء إدخال رقمك الامتحاني (أو كود الأستاذ 0000)</p>
        <input type="number" id="examIdInput" placeholder="أدخل الرقم الامتحاني">
        <button onclick="checkStudent()">دخول الامتحان</button>
        <div id="error-msg">جاري تحميل بيانات المنصة...</div>
        
        <!-- زر رفع الأسئلة والطلاب تلقائياً (يظهر فقط للمعلم عند الدخول بـ 0000) -->
        <div id="teacher-tools" style="display:none; margin-top: 20px; border-top: 2px dashed #ddd; padding-top: 15px;">
            <p style="color: #2980b9; font-weight: bold;">لوحة تحكم الأستاذ</p>
            <button onclick="uploadDataToFirebase()" style="background-color: #e67e22;">رفع الـ 50 سؤالاً والطلاب دفعة واحدة للسحابة</button>
            <div id="upload-status" style="margin-top: 10px; font-size: 13px; color: #27ae60;"></div>
        </div>
    </div>

    <!-- صفحة الأسئلة الامتحانية -->
    <div class="container" id="exam-container" style="display: none;">
        <h2 id="student-welcome"></h2>
        <p style="color: #666;">اختبار مادة الرياضيات - الصف السابع (5 أسئلة عشوائية)</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <div id="questions-container" style="max-height: 60vh; overflow-y: auto; padding-left: 5px;"></div>
        <button id="submit-btn" onclick="submitExam()" style="display:none;">إرسال الإجابات وإنهاء الاختبار</button>

        <div id="result-box" style="display: none; margin-top: 20px;">
            <h3 id="score-text" style="color: #27ae60;"></h3>
            <p>تم حفظ نتيجة اختبارك في السحابة بنجاح.</p>
        </div>
    </div>

    <!-- مكتبات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, getDocs, collection, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCoKXd-RLGwtBQ2Exbk3cxXrzWGXpz40P0",
            authDomain: "school-exams-e9474.firebaseapp.com",
            projectId: "school-exams-e9474",
            storageBucket: "school-exams-e9474.firebasestorage.app",
            messagingSenderId: "86794889937",
            appId: "1:86794889937:web:267fb9d7339968ba2673f0",
            measurementId: "G-0FTLXQV2G9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let questionBank = [];
        let currentStudent = null;
        let activeQuestions = [];

        // قائمة الـ 50 سؤالاً الجاهزة
        const bulkQuestions = [
            { q: "ما ناتج جمع العددين الصحيحين: (-12) + (+7) ؟", options: ["-19", "-5", "+5", "+19"], correct: 1 },
            { q: "ما هو المعكوس الجمعي للعدد الصحيح (-15) ؟", options: ["-15", "0", "15", "1/15"], correct: 2 },
            { q: "ما ناتج ضرب العددين: (-6) × (-4) ؟", options: ["-24", "+24", "-10", "+10"], correct: 1 },
            { q: "ما ناتج قسمة العدد: (-36) ÷ (+9) ؟", options: ["+4", "-4", "-27", "+27"], correct: 1 },
            { q: "ما هي القيمة المطلقة للعدد |-25| ؟", options: ["-25", "0", "25", "5"], correct: 2 },
            { q: "إذا كانت درجة الحرارة (-5) ثم انخفضت بمقدار 3 درجات، فكم تصبح؟", options: ["-2", "+2", "-8", "+8"], correct: 2 },
            { q: "ما ناتج طرح: (+14) - (+20) ؟", options: ["+6", "-6", "+34", "-34"], correct: 1 },
            { q: "ما هي النتيجة الصحيحة للعبارة الآتية: -8 - (-3) ؟", options: ["-11", "-5", "+5", "+11"], correct: 1 },
            { q: "أي الأعداد الآتية هو الأكبر قيمة؟", options: ["-2", "-100", "0", "-1"], correct: 2 },
            { q: "ما ناتج حساب القوة الآتية: 3^2 (أي 3 مرفوعة للقوة 2) ؟", options: ["6", "9", "8", "3"], correct: 1 },
            { q: "ما ناتج العبارة الآتية: 2^3 ؟", options: ["6", "8", "9", "5"], correct: 1 },
            { q: "ما هو الناتج الأبسط للعملية: (-5) × 0 × 12 ؟", options: ["-60", "0", "60", "-720"], correct: 1 },
            { q: "إذا كان x = -4، فما قيمة التعبير: 3x + 5 ؟", options: ["-17", "-7", "7", "17"], correct: 1 },
            { q: "ما ناتج جمع: (-18) + (-22) ؟", options: ["-40", "+40", "-4", "+4"], correct: 0 },
            { q: "ما هو مقلوب أو المعكوس الضربي للعدد 5 ؟", options: ["-5", "1/5", "-1/5", "0"], correct: 1 },
            { q: "ما ناتج قسمة عدد سالب على عدد سالب؟", options: ["سالب دائماً", "موجب دائماً", "صفر", "يختلف حسب العدد"], correct: 1 },
            { q: "ما هو العدد الذي إذا أضيف إليه 7 كان الناتج 3 ؟", options: ["10", "-10", "4", "-4"], correct: 3 },
            { q: "ما ناتج: (-2)^3 ؟", options: ["-8", "+8", "-6", "+6"], correct: 0 },
            { q: "ما ناتج: (-2)^4 ؟", options: ["-16", "+16", "-8", "+8"], correct: 1 },
            { q: "حل المعادلة البسيطة: 2x = 10 ، فما قيمة x ؟", options: ["5", "-5", "20", "2"], correct: 0 },
            { q: "حل المعادلة: x - 4 = 6 ، فما قيمة x ؟", options: ["2", "10", "-10", "-2"], correct: 1 },
            { q: "ما قياس الزاوية القائمة؟", options: ["90 درجة", "180 درجة", "360 درجة", "45 درجة"], correct: 0 },
            { q: "ما قياس الزاوية المستقيمة؟", options: ["90 درجة", "180 درجة", "270 درجة", "360 درجة"], correct: 1 },
            { q: "إذا كانت زاويتان متتامتين، وكان قياس إحداهما 40 درجة، فما قياس الأخرى؟", options: ["50 درجة", "140 درجة", "90 درجة", "180 درجة"], correct: 0 },
            { q: "إذا كانت زاويتان متكاملتين، وكان قياس إحداهما 70 درجة، فما قياس الأخرى؟", options: ["20 درجة", "110 درجة", "90 درجة", "130 درجة"], correct: 1 },
            { q: "مجموع قياسات زوايا المثلث الداخلية يساوي:", options: ["90 درجة", "180 درجة", "360 درجة", "270 درجة"], correct: 1 },
            { q: "ما هو نوع المثلث الذي قياسات زواياه 60، 60، 60 ؟", options: ["مختلف الاضلاع", "متطابق الاضلاع والزوايا", "قائم الزاوية", "منفرج الزاوية"], correct: 1 },
            { q: "ما ناتج تبسيط العبارة الجبرية: 3x + 2x ؟", options: ["5x", "6x^2", "5x^2", "6x"], correct: 0 },
            { q: "ما ناتج فك القوس: 2(x + 3) ؟", options: ["2x + 3", "2x + 6", "x + 6", "5x"], correct: 1 },
            { q: "ما هو المضاعف المشترك الأصغر (م.م.أ) للعددين 4 و 6 ؟", options: ["2", "12", "24", "10"], correct: 1 },
            { q: "ما هو القاسم المشترك الأكبر (ق.م.أ) للعددين 12 و 18 ؟", options: ["6", "3", "2", "36"], correct: 0 },
            { q: "حول الكسر العشري 0.75 إلى كسر اعتيادي في أبسط صورة:", options: ["1/2", "1/4", "3/4", "2/3"], correct: 2 },
            { q: "ما ناتج جمع الكسرين: 1/4 + 2/4 ؟", options: ["3/8", "3/4", "1/2", "3/2"], correct: 1 },
            { q: "ما ناتج ضرب الكسرين: (1/2) × (2/3) ؟", options: ["3/5", "2/6", "1/3", "3/2"], correct: 2 },
            { q: "العدد الأولي من بين الأعداد الآتية هو:", options: ["9", "15", "17", "21"], correct: 2 },
            { q: "العدد غير الأولي (المؤلف) بين الأعداد التالية هو:", options: ["13", "19", "23", "27"], correct: 3 },
            { q: "ما ناتج: |-15| + |-5| ؟", options: ["-20", "10", "20", "-10"], correct: 2 },
            { q: "إذا كان سعر القلم 350 ليرة، فما ثمن 4 أقلام؟", options: ["1200 ليرة", "1400 ليرة", "1500 ليرة", "1000 ليرة"], correct: 1 },
            { q: "ما هي مساحة مستطيل طوله 8 سم وعرضه 5 سم؟", options: ["26 سم مربع", "40 سم مربع", "13 سم", "40 سم"], correct: 1 },
            { q: "ما هو محيط مربع طول طلعه 6 سم؟", options: ["36 سم", "24 سم", "12 سم", "18 سم"], correct: 1 },
            { q: "ما ناتج العمليات الحسابية التالية طبقاً للأولوية: 3 + 4 × 2 ؟", options: ["14", "11", "10", "9"], correct: 1 },
            { q: "ما ناتج العبارة: (5 + 3) × 2 ؟", options: ["13", "16", "11", "10"], correct: 1 },
            { q: "إذا تحركنا على خط الاعداد من الرقم 4 يساراً بمقدار 7 خطوات، فإلى أين نصل؟", options: ["3", "-3", "11", "-11"], correct: 1 },
            { q: "ما هو العدد الذي إذا ضرب في -4 كان الناتج 28 ؟", options: ["7", "-7", "12", "-12"], correct: 1 },
            { q: "أي الكسور الآتية يكسر أكبر قيمة أو يكافئ النصف؟", options: ["2/6", "3/6", "1/4", "2/8"], correct: 1 },
            { q: "ما ناتج تبسيط الجذر التربيعي للعدد 81 (أي الجذر التربيعي لـ 81) ؟", options: ["8", "9", "18", "3"], correct: 1 },
            { q: "ما ناتج قسمة أي عدد غير الصفر على نفسه؟", options: ["صفر", "العدد نفسه", "واحد", "غير معرّف"], correct: 2 },
            { q: "ما ناتج قسمة الصفر على أي عدد غير الصفر؟", options: ["صفر", "واحد", "غير معرّف", "العدد نفسه"], correct: 0 },
            { q: "متوازي اضلاع طول قاعدته 10 سم وارتفاعه 6 سم، فما مساحته؟", options: ["30 سم مربع", "60 سم مربع", "32 سم مربع", "16 سم مربع"], correct: 1 },
            { q: "ما هو المعكوس الضربي للعدد -1/3 ؟", options: ["1/3", "3", "-3", "3/1"], correct: 2 }
        ];

        // قائمة الطلاب التجريبية (يمكنك تعديلها أو إضافة أرقام طلابك)
        const bulkStudents = [
            { id: "7001", name: "أحمد محمد العلي" },
            { id: "7002", name: "محمود خالد المحمد" },
            { id: "7003", name: "فاطمة عمر الشيخ" },
            { id: "7004", name: "سارة أحمد النجار" },
            { id: "7005", name: "عمر محمود دالاتي" }
        ];

        // دالة الرفع التلقائي إلى فايربيس عند الضغط من حساب المعلم
        window.uploadDataToFirebase = async function() {
            const statusDiv = document.getElementById("upload-status");
            statusDiv.innerText = "جاري رفع الأسئلة والطلاب إلى السحابة...";
            
            try {
                // رفع الأسئلة
                for (let i = 0; i < bulkQuestions.length; i++) {
                    await setDoc(doc(db, "questions", "q_" + (i + 1)), bulkQuestions[i]);
                }
                // رفع الطلاب
                for (let student of bulkStudents) {
                    await setDoc(doc(db, "students", student.id), { name: student.name });
                }
                statusDiv.innerText = "تم رفع الـ 50 سؤالاً وقائمة الطلاب بنجاح تام! يمكنك بدء الاختبار الآن.";
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "حدث خطأ أثناء الرفع، تأكد من اتصال الإنترنت.";
            }
        };

        // تحميل بنك الأسئلة للاستخدام
        async function loadQuestionBank() {
            try {
                const querySnapshot = await getDocs(collection(db, "questions"));
                questionBank = [];
                querySnapshot.forEach((doc) => {
                    questionBank.push(doc.data());
                });
                document.getElementById("error-msg").innerText = "";
            } catch (error) {
                console.error("خطأ في تحميل الأسئلة:", error);
                document.getElementById("error-msg").innerText = "تأكد من الاتصال بالإنترنت.";
            }
        }
        loadQuestionBank();

        window.checkStudent = async function() {
            const inputId = document.getElementById("examIdInput").value.trim();
            const errorMsg = document.getElementById("error-msg");
            
            if (inputId === "0000") {
                currentStudent = { id: "0000", name: "الأستاذ عبدالمنعم حسن هلال (معلم المادة)" };
                // إظهار زر الرفع التلقائي للمعلم فقط
                document.getElementById("teacher-tools").style.display = "block";
                errorMsg.innerText = "أهلاً بك يا استاذ، يمكنك الضغط بالأسفل لرفع البيانات دفعة واحدة.";
                return;
            } else {
                try {
                    const studentDoc = await getDoc(doc(db, "students", inputId));
                    if (studentDoc.exists()) {
                        currentStudent = { id: inputId, ...studentDoc.data() };
                    } else {
                        errorMsg.innerText = "الرقم الامتحاني غير مسجل في قاعدة البيانات.";
                        return;
                    }
                } catch (error) {
                    errorMsg.innerText = "حدث خطأ أثناء التحقق من الطالب.";
                    return;
                }
            }

            if (questionBank.length === 0) {
                errorMsg.innerText = "بنك الأسئلة فارغ بالسحابة، اخلُص بكود المعلم 0000 واضغط زر الرفع أولاً!";
                return;
            }

            activeQuestions = getRandomQuestions(questionBank, 5);
            renderQuestions();

            document.getElementById("login-container").style.display = "none";
            document.getElementById("exam-container").style.display = "block";
            document.getElementById("student-welcome").innerText = "أهلاً بك، " + currentStudent.name;
            document.getElementById("submit-btn").style.display = "block";
        };

        function getRandomQuestions(arr, count) {
            let shuffled = [...arr].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function renderQuestions() {
            const container = document.getElementById("questions-container");
            container.innerHTML = "";
            activeQuestions.forEach((item, index) => {
                let optionsHtml = "";
                item.options.forEach((opt, optIndex) => {
                    optionsHtml += `<label><input type="radio" name="q_${index}" value="${optIndex}"> ${opt}</label>`;
                });
                container.innerHTML += `
                    <div class="question-box">
                        <p>${index + 1}. ${item.q}</p>
                        <div class="options">${optionsHtml}</div>
                    </div>
                `;
            });
        }

        window.submitExam = async function() {
            let score = 0;
            const pointsPerQuestion = 20;

            activeQuestions.forEach((item, index) => {
                const selected = document.querySelector(`input[name="q_${index}"]:checked`);
                if (selected && parseInt(selected.value) === item.correct) {
                    score += pointsPerQuestion;
                }
            });

            document.getElementById("questions-container").style.display = "none";
            document.getElementById("submit-btn").style.display = "none";
            document.getElementById("result-box").style.display = "block";
            document.getElementById("score-text").innerText = `علامتك النهائية هي: ${score} من 100`;

            try {
                const docId = currentStudent.id === "0000" ? "teacher_" + Date.now() : currentStudent.id;
                await setDoc(doc(db, "exam_results", docId), {
                    examId: currentStudent.id,
                    studentName: currentStudent.name,
                    score: score,
                    submitTime: new Date().toISOString()
                });
            } catch (error) {
                console.error("خطأ في حفظ النتيجة:", error);
            }
        };
    </script>
</body>
</html>
